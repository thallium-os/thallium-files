[package]
name = "thallium-backend"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
qt = [ "dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib" ]

[dependencies]
cxx = { version = "1.0", optional = true }
cxx-qt = { version = "0.9", optional = true }
cxx-qt-lib = { version = "0.9", features = [ "qt_full" ], optional = true }
thallium-actions = { path = "../thallium-actions" }
thallium-fs-core = { path = "../thallium-fs-core" }
thallium-icons = { path = "../thallium-icons" }
thallium-protocol = { path = "../thallium-protocol" }
thallium-rclone = { path = "../thallium-rclone" }
thallium-scheduler = { path = "../thallium-scheduler" }
thallium-state = { path = "../thallium-state" }
thallium-vfs = { path = "../thallium-vfs" }
thallium-watcher = { path = "../thallium-watcher" }
tokio = { workspace = true, features = [ "rt-multi-thread", "sync" ] }

[build-dependencies]
cxx-qt-build = { version = "0.9", features = [ "link_qt_object_files" ] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "thallium-file-manager"
path = "src/main.rs"
required-features = [ "qt" ]

[lints]
workspace = true
